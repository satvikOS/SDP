version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd frontend/web-app
        - npm install
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: frontend/web-app/.next
    files:
      - '**/*'
  cache:
    paths:
      - frontend/web-app/node_modules/**/*
