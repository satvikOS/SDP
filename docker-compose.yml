version: '3.8'

services:
  # PostgreSQL with pgvector
  postgres:
    image: ankane/pgvector:latest
    container_name: foresight-postgres
    environment:
      POSTGRES_USER: foresight
      POSTGRES_PASSWORD: dev_password_123
      POSTGRES_DB: foresight
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foresight"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: foresight-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Bedrock Orchestrator
  bedrock-orchestrator:
    build:
      context: ./backend/services/bedrock-orchestrator
      dockerfile: Dockerfile
    container_name: bedrock-orchestrator
    ports:
      - "8000:8000"
    environment:
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - DATABASE_URL=postgresql://foresight:dev_password_123@postgres:5432/foresight
      - REDIS_URL=redis://redis:6379/0
      - COST_TRACKING_ENABLED=true
      - MONTHLY_BUDGET_USD=50
      - ENABLE_MODEL_FALLBACK=true
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/services/bedrock-orchestrator:/app
    restart: unless-stopped

  # Vector Service (for RAG)
  vector-service:
    build:
      context: ./backend/services/vector-service
      dockerfile: Dockerfile
    container_name: vector-service
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://foresight:dev_password_123@postgres:5432/foresight
      - REDIS_URL=redis://redis:6379/1
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/services/vector-service:/app
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
