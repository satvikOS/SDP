service: ai-foresight-platform

frameworkVersion: '3'

plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    dockerizePip: false  # Disabled - no Docker available
    layer:
      name: python-requirements-multi-ai-v2  # Force new layer with Gemini SDK
      description: Python requirements with google-generativeai for Multi-AI Pipeline
    zip: true
    slim: true
    strip: false
    noDeploy:
      - boto3
      - botocore
    invalidateCaches: true
    pythonBin: python3

provider:
  name: aws
  runtime: python3.10
  region: us-east-1
  stage: ${opt:stage, 'dev'}

  layers:
    - Ref: PythonRequirementsLambdaLayer

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - bedrock:InvokeModel
            - bedrock:InvokeModelWithResponseStream
            - bedrock:ListFoundationModels
          Resource: '*'
        - Effect: Allow
          Action:
            - lambda:InvokeFunction
          Resource: 'arn:aws:lambda:${self:provider.region}:*:function:*'
        - Effect: Allow
          Action:
            - aws-marketplace:ViewSubscriptions
            - aws-marketplace:Subscribe
          Resource: '*'
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:ListBucket
          Resource:
            - arn:aws:s3:::ai-foresight-data-${self:provider.stage}
            - arn:aws:s3:::ai-foresight-data-${self:provider.stage}/*
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:*:table/ai-foresight-cache-${self:provider.stage}
            - arn:aws:dynamodb:${self:provider.region}:*:table/ai-foresight-scenarios-${self:provider.stage}
            - arn:aws:dynamodb:${self:provider.region}:*:table/ai-foresight-scenarios-${self:provider.stage}/index/*

  environment:
    STAGE: ${self:provider.stage}
    COST_TRACKING_ENABLED: 'true'
    MONTHLY_BUDGET_USD: '50'
    ENABLE_MODEL_FALLBACK: 'true'
    LOG_LEVEL: INFO
    # Multi-AI Pipeline Configuration
    ENABLE_MULTI_MODEL_PIPELINE: 'true'
    GOOGLE_API_KEY: 'AIzaSyDM-pYF5GB0u6GltVxeHlAGMj6Ck1FcZls'

  httpApi:
    cors: true
    metrics: true

package:
  individually: true
  patterns:
    - '!node_modules/**'
    - '!.git/**'
    - '!.venv/**'
    - '!__pycache__/**'
    - '!frontend/**'
    - '!.sst/**'
    - '!.next/**'

functions:
  health:
    handler: backend/services/bedrock-orchestrator/lambda_handler.health
    timeout: 10
    memorySize: 256
    layers: []  # No layers needed for health check
    events:
      - httpApi:
          path: /health
          method: get
    package:
      patterns:
        - backend/services/bedrock-orchestrator/**

  listAgents:
    handler: backend/services/bedrock-orchestrator/lambda_handler.list_agents
    timeout: 10
    memorySize: 256
    events:
      - httpApi:
          path: /agents
          method: get
    package:
      patterns:
        - backend/services/bedrock-orchestrator/**

  executeAgent:
    handler: backend/services/bedrock-orchestrator/lambda_handler.execute_agent
    timeout: 900
    memorySize: 2048
    events:
      - httpApi:
          path: /execute
          method: post
    package:
      patterns:
        - backend/services/bedrock-orchestrator/**

  costReport:
    handler: backend/services/bedrock-orchestrator/lambda_handler.cost_report
    timeout: 10
    memorySize: 256
    events:
      - httpApi:
          path: /costs
          method: get
    package:
      patterns:
        - backend/services/bedrock-orchestrator/**

  generateScenario:
    handler: backend/services/bedrock-orchestrator/lambda_handler.generate_scenario
    timeout: 900
    memorySize: 3008
    events:
      - httpApi:
          path: /scenarios/generate
          method: post
    package:
      patterns:
        - backend/services/bedrock-orchestrator/**

  testBedrock:
    handler: backend/services/bedrock-orchestrator/lambda_handler.test_bedrock
    timeout: 30
    memorySize: 512
    events:
      - httpApi:
          path: /test/bedrock
          method: get
    package:
      patterns:
        - backend/services/bedrock-orchestrator/**

  listAvailableModels:
    handler: backend/services/bedrock-orchestrator/lambda_handler.list_available_models
    timeout: 30
    memorySize: 512
    events:
      - httpApi:
          path: /models/list
          method: get
    package:
      patterns:
        - backend/services/bedrock-orchestrator/**

  startScenarioGenerationAsync:
    handler: backend/services/bedrock-orchestrator/lambda_handler.start_scenario_generation_async
    timeout: 30
    memorySize: 512
    events:
      - httpApi:
          path: /scenarios/generate/async
          method: post
    package:
      patterns:
        - backend/services/bedrock-orchestrator/**

  generateScenarioAsyncWorker:
    handler: backend/services/bedrock-orchestrator/lambda_handler.generate_scenario_async_worker
    timeout: 900
    memorySize: 3008
    package:
      patterns:
        - backend/services/bedrock-orchestrator/**

  transformToBoardroom:
    handler: backend/services/bedrock-orchestrator/lambda_handler_br_transform.transform_to_boardroom
    timeout: 180
    memorySize: 1024
    events:
      - httpApi:
          path: /scenarios/transform/boardroom
          method: post
    package:
      patterns:
        - backend/services/bedrock-orchestrator/**

  getScenarioStatus:
    handler: backend/services/bedrock-orchestrator/lambda_handler.get_scenario_status
    timeout: 10
    memorySize: 256
    events:
      - httpApi:
          path: /scenarios/status/{job_id}
          method: get
    package:
      patterns:
        - backend/services/bedrock-orchestrator/**

  listScenarios:
    handler: backend/services/bedrock-orchestrator/lambda_handler.list_scenarios
    timeout: 10
    memorySize: 256
    events:
      - httpApi:
          path: /scenarios
          method: get
    package:
      patterns:
        - backend/services/bedrock-orchestrator/**

  getAnalytics:
    handler: backend/services/bedrock-orchestrator/lambda_handler.get_analytics
    timeout: 30
    memorySize: 512
    events:
      - httpApi:
          path: /analytics
          method: get
    package:
      patterns:
        - backend/services/bedrock-orchestrator/**

  exportToPdf:
    handler: backend/services/bedrock-orchestrator/document_export.export_to_pdf
    timeout: 60
    memorySize: 1024
    events:
      - httpApi:
          path: /scenarios/export/pdf
          method: post
    package:
      patterns:
        - backend/services/bedrock-orchestrator/**

  exportToPptx:
    handler: backend/services/bedrock-orchestrator/document_export.export_to_pptx
    timeout: 60
    memorySize: 1024
    events:
      - httpApi:
          path: /scenarios/export/pptx
          method: post
    package:
      patterns:
        - backend/services/bedrock-orchestrator/**

  exportToWord:
    handler: backend/services/bedrock-orchestrator/document_export.export_to_word
    timeout: 60
    memorySize: 1024
    events:
      - httpApi:
          path: /scenarios/export/word
          method: post
    package:
      patterns:
        - backend/services/bedrock-orchestrator/**

  exportToEpub:
    handler: backend/services/bedrock-orchestrator/document_export.export_to_epub
    timeout: 60
    memorySize: 1024
    events:
      - httpApi:
          path: /scenarios/export/epub
          method: post
    package:
      patterns:
        - backend/services/bedrock-orchestrator/**

  deleteScenario:
    handler: backend/services/bedrock-orchestrator/lambda_handler.delete_scenario
    timeout: 10
    memorySize: 256
    events:
      - httpApi:
          path: /scenarios/{scenario_id}
          method: delete
    package:
      patterns:
        - backend/services/bedrock-orchestrator/**

resources:
  Resources:
    DataLakeBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ai-foresight-data-${self:provider.stage}
        VersioningConfiguration:
          Status: Enabled
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256

    CacheTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ai-foresight-cache-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: cacheKey
            AttributeType: S
        KeySchema:
          - AttributeName: cacheKey
            KeyType: HASH
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true

    ScenariosTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ai-foresight-scenarios-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: scenarioId
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: N
        KeySchema:
          - AttributeName: scenarioId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: CreatedAtIndex
            KeySchema:
              - AttributeName: createdAt
                KeyType: HASH
            Projection:
              ProjectionType: ALL

  Outputs:
    ApiEndpoint:
      Description: API Gateway endpoint URL
      Value:
        Fn::Sub: https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
    DataLakeBucket:
      Description: S3 Data Lake Bucket
      Value:
        Ref: DataLakeBucket
