service: ai-foresight-platform

frameworkVersion: '3'

provider:
  name: aws
  runtime: python3.10
  region: us-east-1
  stage: ${opt:stage, 'dev'}

  # IAM Permissions
  iam:
    role:
      statements:
        # Bedrock access
        - Effect: Allow
          Action:
            - bedrock:InvokeModel
            - bedrock:InvokeModelWithResponseStream
          Resource: '*'

        # S3 access for data lake
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:ListBucket
          Resource:
            - arn:aws:s3:::ai-foresight-data-${self:provider.stage}
            - arn:aws:s3:::ai-foresight-data-${self:provider.stage}/*

        # DynamoDB access
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:*:table/ai-foresight-cache-${self:provider.stage}
            - arn:aws:dynamodb:${self:provider.region}:*:table/ai-foresight-scenarios-${self:provider.stage}
            - arn:aws:dynamodb:${self:provider.region}:*:table/ai-foresight-scenarios-${self:provider.stage}/index/*

  # Environment variables
  environment:
    STAGE: ${self:provider.stage}
    AWS_REGION: ${self:provider.region}
    COST_TRACKING_ENABLED: 'true'
    MONTHLY_BUDGET_USD: '50'
    ENABLE_MODEL_FALLBACK: 'true'
    LOG_LEVEL: INFO

  # API Gateway configuration
  httpApi:
    cors: true
    metrics: true

# Package configuration
package:
  individually: true
  patterns:
    - '!node_modules/**'
    - '!.git/**'
    - '!.venv/**'
    - '!__pycache__/**'

functions:
  # Health check endpoint
  health:
    handler: backend/services/bedrock-orchestrator/lambda_handler.health
    timeout: 10
    memorySize: 256
    events:
      - httpApi:
          path: /health
          method: get
    package:
      patterns:
        - backend/services/bedrock-orchestrator/**
        - backend/shared/**

  # List available agents
  listAgents:
    handler: backend/services/bedrock-orchestrator/lambda_handler.list_agents
    timeout: 10
    memorySize: 256
    events:
      - httpApi:
          path: /agents
          method: get
    package:
      patterns:
        - backend/services/bedrock-orchestrator/**
        - backend/shared/**

  # Execute agent (main function)
  executeAgent:
    handler: backend/services/bedrock-orchestrator/lambda_handler.execute_agent
    timeout: 900  # 15 minutes max
    memorySize: 2048
    events:
      - httpApi:
          path: /execute
          method: post
    package:
      patterns:
        - backend/services/bedrock-orchestrator/**
        - backend/shared/**

  # Get cost report
  costReport:
    handler: backend/services/bedrock-orchestrator/lambda_handler.cost_report
    timeout: 10
    memorySize: 256
    events:
      - httpApi:
          path: /costs
          method: get
    package:
      patterns:
        - backend/services/bedrock-orchestrator/**
        - backend/shared/**

  # Generate scenario (full workflow)
  generateScenario:
    handler: backend/services/bedrock-orchestrator/lambda_handler.generate_scenario
    timeout: 900  # 15 minutes
    memorySize: 3008  # Max for better performance
    events:
      - httpApi:
          path: /scenarios/generate
          method: post
    package:
      patterns:
        - backend/services/bedrock-orchestrator/**
        - backend/shared/**

# Resources (infrastructure)
resources:
  Resources:
    # S3 Bucket for data lake
    DataLakeBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ai-foresight-data-${self:provider.stage}
        VersioningConfiguration:
          Status: Enabled
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256

    # DynamoDB table for caching (cheaper than ElastiCache for low volume)
    CacheTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ai-foresight-cache-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST  # Only pay for what you use
        AttributeDefinitions:
          - AttributeName: cacheKey
            AttributeType: S
        KeySchema:
          - AttributeName: cacheKey
            KeyType: HASH
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true

    # DynamoDB table for scenarios
    ScenariosTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ai-foresight-scenarios-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: scenarioId
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: N
        KeySchema:
          - AttributeName: scenarioId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: CreatedAtIndex
            KeySchema:
              - AttributeName: createdAt
                KeyType: HASH
            Projection:
              ProjectionType: ALL

  # Outputs
  Outputs:
    ApiEndpoint:
      Description: API Gateway endpoint URL
      Value:
        Fn::Sub: https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com

    DataLakeBucket:
      Description: S3 Data Lake Bucket
      Value:
        Ref: DataLakeBucket

