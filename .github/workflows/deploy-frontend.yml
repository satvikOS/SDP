name: Deploy Frontend to CloudFront

on:
  push:
    branches:
      - claude/ai-foresight-platform-yEVtZ
    paths:
      - 'frontend/**'
      - 'sst.config.ts'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install root dependencies
        run: npm install

      - name: Install frontend dependencies
        working-directory: frontend/web-app
        run: npm install

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy frontend with SST
        run: |
          npm run sst:deploy

      - name: Display deployment info
        run: |
          echo "✅ Frontend deployed successfully to CloudFront!"
          echo "Check the logs above for your CloudFront URL"
