name: Deploy Frontend to AWS Amplify

on:
  push:
    branches:
      - main
      - claude/ai-foresight-platform-yEVtZ
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'

  workflow_dispatch:

env:
  NODE_VERSION: '18'

jobs:
  deploy:
    name: Deploy Next.js Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: frontend/web-app
        run: npm install

      - name: Build application
        working-directory: frontend/web-app
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.API_ENDPOINT }}
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to S3
        working-directory: frontend/web-app
        run: |
          aws s3 sync out/ s3://ai-foresight-frontend-${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}/ --delete

      - name: Invalidate CloudFront cache
        if: github.ref == 'refs/heads/main'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Deployment summary
        run: |
          STAGE=${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
          echo "✅ Frontend deployed to S3: ai-foresight-frontend-${STAGE}"
