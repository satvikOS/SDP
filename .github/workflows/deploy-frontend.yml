name: Deploy Frontend to AWS Amplify

on:
  push:
    branches:
      - main
      - claude/ai-foresight-platform-yEVtZ
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'

  workflow_dispatch:

env:
  NODE_VERSION: '18'

jobs:
  deploy:
    name: Deploy Next.js Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: frontend/web-app
        run: npm install

      - name: Build application
        working-directory: frontend/web-app
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.API_ENDPOINT }}
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Deploy to AWS Amplify Hosting (supports Next.js SSR with dynamic routes)
      # Note: This requires AWS Amplify app to be set up first
      # For now, the build completes successfully and artifacts can be deployed manually
      # TODO: Set up AWS Amplify Hosting or use alternative deployment for Next.js SSR

      - name: Package build artifacts
        working-directory: frontend/web-app
        run: |
          echo "✅ Build completed successfully"
          echo "📦 Build artifacts ready in .next directory"
          echo "⚠️  Note: Deployment requires AWS Amplify Hosting (not S3 static hosting)"
          echo "   Dynamic routes require server-side rendering support"

      - name: Deployment summary
        run: |
          STAGE=${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
          echo "✅ Frontend build completed for ${STAGE} environment"
          echo "📁 Build output: frontend/web-app/.next"
          echo "🔧 Next step: Deploy to AWS Amplify Hosting or Vercel"
