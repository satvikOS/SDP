name: Deploy Backend API

on:
  push:
    branches:
      - claude/ai-foresight-platform-yEVtZ
    paths:
      - 'backend/**'
      - 'serverless.yml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.19'

      - name: Install Serverless Framework and plugins
        run: npm install

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Check and recover CloudFormation stack if stuck
        shell: bash
        run: |
          echo "========================================="
          echo "RECOVERY STEP STARTING"
          echo "========================================="

          STACK_NAME="ai-foresight-platform-dev"
          echo "Stack name: $STACK_NAME"

          # Get stack status
          echo "Querying CloudFormation..."
          STACK_STATUS=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query 'Stacks[0].StackStatus' --output text 2>&1 || echo "DOES_NOT_EXIST")
          echo ">>> Current stack status: $STACK_STATUS <<<"

          if [ "$STACK_STATUS" = "DELETE_FAILED" ]; then
            echo "🔴 DELETE_FAILED detected! Force deleting stack..."

            # Get ALL resources to retain them (orphan everything)
            echo "Getting all stack resources..."
            ALL_RESOURCES=$(aws cloudformation describe-stack-resources --stack-name $STACK_NAME --query "StackResources[].LogicalResourceId" --output text 2>&1 || echo "")

            if [ -n "$ALL_RESOURCES" ]; then
              echo "Found resources to retain: $ALL_RESOURCES"

              # Build retain arguments
              RETAIN_ARGS=""
              for res in $ALL_RESOURCES; do
                RETAIN_ARGS="$RETAIN_ARGS --retain-resources $res"
                echo "  - Will retain: $res"
              done

              echo "Executing: aws cloudformation delete-stack with resource retention..."
              aws cloudformation delete-stack --stack-name $STACK_NAME $RETAIN_ARGS || echo "Delete command completed with status: $?"
            else
              echo "No resources found, trying simple delete..."
              aws cloudformation delete-stack --stack-name $STACK_NAME || echo "Delete command completed with status: $?"
            fi

            echo "Waiting 60 seconds for stack deletion to process..."
            sleep 60

            echo "Checking if stack still exists..."
            FINAL_CHECK=$(aws cloudformation describe-stacks --stack-name $STACK_NAME 2>&1 || echo "STACK_GONE")
            if [[ "$FINAL_CHECK" == *"STACK_GONE"* ]] || [[ "$FINAL_CHECK" == *"does not exist"* ]]; then
              echo "✅ Stack successfully deleted!"
            else
              echo "⚠️  Stack may still exist, but proceeding with deployment anyway"
              echo "  Status: $FINAL_CHECK"
            fi

          elif [ "$STACK_STATUS" = "UPDATE_ROLLBACK_FAILED" ]; then
            echo "⚠️  Stack is in UPDATE_ROLLBACK_FAILED state. Finding failed resources..."

            # Get all failed resources
            FAILED_RESOURCES=$(aws cloudformation describe-stack-resources \
              --stack-name $STACK_NAME \
              --query "StackResources[?ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='DELETE_FAILED'].LogicalResourceId" \
              --output text)

            if [ -n "$FAILED_RESOURCES" ]; then
              echo "Failed resources found: $FAILED_RESOURCES"
              echo "Attempting rollback with --resources-to-skip..."

              # Convert space-separated list to proper format
              SKIP_ARGS=""
              for resource in $FAILED_RESOURCES; do
                SKIP_ARGS="$SKIP_ARGS --resources-to-skip $resource"
              done

              aws cloudformation continue-update-rollback --stack-name $STACK_NAME $SKIP_ARGS || {
                echo "⚠️  Rollback with skipped resources also failed. Trying without skipping..."
                aws cloudformation continue-update-rollback --stack-name $STACK_NAME
              }
            else
              echo "No specific failed resources found. Attempting standard rollback..."
              aws cloudformation continue-update-rollback --stack-name $STACK_NAME
            fi

            echo "Waiting for rollback to complete (max 15 minutes)..."
            for i in {1..90}; do
              sleep 10
              CURRENT_STATUS=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query 'Stacks[0].StackStatus' --output text)
              echo "[$i/90] Current status: $CURRENT_STATUS"

              if [ "$CURRENT_STATUS" = "UPDATE_ROLLBACK_COMPLETE" ] || [ "$CURRENT_STATUS" = "ROLLBACK_COMPLETE" ]; then
                echo "✅ Stack recovered successfully!"
                break
              elif [ "$CURRENT_STATUS" = "UPDATE_ROLLBACK_FAILED" ]; then
                echo "❌ Stack rollback failed again. Deleting and recreating stack..."
                aws cloudformation delete-stack --stack-name $STACK_NAME
                echo "Waiting for stack deletion (max 10 minutes)..."
                aws cloudformation wait stack-delete-complete --stack-name $STACK_NAME || true
                echo "✅ Stack deleted. New deployment will create fresh stack."
                break
              fi
            done
          elif [ "$STACK_STATUS" = "UPDATE_IN_PROGRESS" ] || [ "$STACK_STATUS" = "UPDATE_ROLLBACK_IN_PROGRESS" ]; then
            echo "⏳ Stack update/rollback already in progress. Waiting for completion..."
            sleep 60
          elif [ "$STACK_STATUS" = "DOES_NOT_EXIST" ]; then
            echo "✅ Stack does not exist. Will be created on deployment."
          else
            echo "✅ Stack is in acceptable state: $STACK_STATUS"
          fi

          echo ""
          echo "========================================="
          echo "RECOVERY STEP COMPLETED"
          echo "Proceeding to deployment..."
          echo "========================================="

      - name: Deploy backend with Serverless
        run: |
          npx serverless deploy --stage dev --verbose

      - name: Display API endpoint
        run: |
          echo "✅ Backend API deployed successfully!"
          npx serverless info --stage dev
