name: Deploy Vercel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/web-app/**'
      - '.github/workflows/deploy-vercel.yml'

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      XAI_API: ${{ secrets.XAI_API }}
      GEMINI_API: ${{ secrets.GEMINI_API }}
      OPENAI_API: ${{ secrets.OPENAI_API }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/web-app/package-lock.json
      - run: npm ci
        working-directory: frontend/web-app
      - run: npm run lint && npm run typecheck && npm run test
        working-directory: frontend/web-app
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@62.2.0
      - name: Pull project settings
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - name: Build candidate artifact
        run: vercel build --token="$VERCEL_TOKEN"
      - name: Deploy immutable preview
        id: preview
        shell: bash
        run: |
          deployment_url="$(vercel deploy --prebuilt --archive=tgz --token="$VERCEL_TOKEN" \
            --env "XAI_API=$XAI_API" \
            --env "GEMINI_API=$GEMINI_API" \
            --env "OPENAI_API=$OPENAI_API" \
            --env "XAI_MODEL=grok-4.3" \
            --env "GEMINI_MODEL=gemini-3.7-flash" \
            --env "OPENAI_MODEL=gpt-6-luna")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
      - name: Smoke test runtime configuration
        shell: bash
        run: |
          # curl's beta argument parser forwards --token to system curl;
          # Vercel authenticates using the existing VERCEL_TOKEN environment.
          vercel curl /api/health --deployment "${{ steps.preview.outputs.url }}" -- \
            --fail --silent --show-error --retry 5 --retry-delay 5 | node frontend/web-app/scripts/verify-runtime-health.mjs
      - name: Pull production settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build production artifact
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy verified production artifact
        id: production
        shell: bash
        run: |
          deployment_url="$(vercel deploy --prebuilt --archive=tgz --prod --token="$VERCEL_TOKEN" \
            --env "XAI_API=$XAI_API" \
            --env "GEMINI_API=$GEMINI_API" \
            --env "OPENAI_API=$OPENAI_API" \
            --env "XAI_MODEL=grok-4.3" \
            --env "GEMINI_MODEL=gemini-3.7-flash" \
            --env "OPENAI_MODEL=gpt-6-luna")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
      - name: Smoke test production deployment
        shell: bash
        run: |
          vercel curl /api/health --deployment "${{ steps.production.outputs.url }}" -- \
            --fail --silent --show-error --retry 5 --retry-delay 5 | node frontend/web-app/scripts/verify-runtime-health.mjs
      - name: Deployment summary
        run: |
          echo "## Deploy Result" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Preview**: ${{ steps.preview.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Production**: ${{ steps.production.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Target**: production" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status**: READY" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit**: ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Framework**: Next.js" >> "$GITHUB_STEP_SUMMARY"
