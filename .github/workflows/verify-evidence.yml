name: Verify live evidence pipeline
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/web-app/package-lock.json
      - run: npm ci
        working-directory: frontend/web-app
      - name: Exercise paid research, challenge, synthesis and audit
        run: node scripts/verify-live-evidence.mjs https://sdp-decision-room.vercel.app
        working-directory: frontend/web-app
      - name: Build the actual cited PDF
        run: npm test -- src/lib/report-export.test.ts
        working-directory: frontend/web-app
        env:
          SDP_E2E_RESULT: ../../output/pdf/evidence-e2e-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-verification
          path: |
            output/pdf/evidence-e2e-result.json
            output/pdf/sdp-evidence-verified-report.pdf
          retention-days: 7
