name: Deploy to AWS Lambda

on:
  push:
    branches:
      - main
      - claude/ai-foresight-platform-yEVtZ
    paths:
      - 'backend/**'
      - 'serverless.yml'
      - '.github/workflows/**'

  workflow_dispatch:  # Allow manual triggers

env:
  AWS_REGION: us-east-1
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.10'

jobs:
  deploy:
    name: Deploy Serverless Application
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: |
          npm install
          npm install -g serverless

      - name: Install Python dependencies
        run: |
          cd backend/services/bedrock-orchestrator
          pip install -r requirements.txt

      - name: Run tests
        run: |
          echo "Running tests..."
          # Add pytest commands here when tests are ready
          # pytest backend/tests/

      - name: Deploy to AWS Lambda (dev)
        if: github.ref != 'refs/heads/main'
        run: |
          serverless deploy --stage dev --verbose
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Deploy to AWS Lambda (production)
        if: github.ref == 'refs/heads/main'
        run: |
          serverless deploy --stage prod --verbose
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Get deployment info
        id: deployment
        run: |
          ENDPOINT=$(serverless info --stage dev | grep "endpoint:" | awk '{print $2}')
          echo "endpoint=$ENDPOINT" >> $GITHUB_OUTPUT

      - name: Smoke test deployment
        run: |
          echo "Testing health endpoint..."
          ENDPOINT="${{ steps.deployment.outputs.endpoint }}"
          curl -f "${ENDPOINT}/health" || exit 1
          echo "✅ Deployment successful!"

      - name: Display deployment info
        if: success()
        run: |
          STAGE=${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
          echo "=========================================="
          echo "✅ Successfully deployed to AWS Lambda (${STAGE})"
          echo "=========================================="
          echo "🔗 API Endpoint: ${{ steps.deployment.outputs.endpoint }}"
          echo "📊 Health Check: ${{ steps.deployment.outputs.endpoint }}/health"
          echo "🤖 Agents List: ${{ steps.deployment.outputs.endpoint }}/agents"
          echo "🎯 Generate Scenarios: ${{ steps.deployment.outputs.endpoint }}/generate-scenarios"
          echo "=========================================="

      - name: Post deployment summary
        uses: actions/github-script@v7
        if: success()
        continue-on-error: true
        with:
          script: |
            const endpoint = '${{ steps.deployment.outputs.endpoint }}';
            const stage = '${{ github.ref }}' === 'refs/heads/main' ? 'prod' : 'dev';

            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `✅ Successfully deployed to AWS Lambda (${stage})!\n\n` +
                    `🔗 API Endpoint: ${endpoint}\n` +
                    `📊 Health: ${endpoint}/health\n` +
                    `🤖 Agents: ${endpoint}/agents`
            });

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '❌ Deployment failed! Check the Actions logs for details.'
            });
